<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Double Pendulum Fractal Explorer</title>
    <meta name="description" content="Every pixel hides a double-pendulum experiment. Zoom into a live fractal map of motion, instability, and chaos.">
    <link rel="canonical" href="https://nebelmesser.com/fractal/double-pendulum.html">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nebelmesser.com/fractal/double-pendulum.html">
    <meta property="og:title" content="Double Pendulum Fractal Explorer">
    <meta property="og:description" content="Every pixel hides a double-pendulum experiment. Zoom into a live fractal map of motion, instability, and chaos.">
    <meta property="og:image" content="https://nebelmesser.com/fractal/img/preview.jpg">
    <meta property="og:image:width" content="1257">
    <meta property="og:image:height" content="1080">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Double Pendulum Fractal Explorer">
    <meta name="twitter:description" content="Every pixel hides a double-pendulum experiment. Zoom into a live fractal map of motion, instability, and chaos.">
    <meta name="twitter:image" content="https://nebelmesser.com/fractal/img/preview.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&display=swap" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5D8EGFYM3L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5D8EGFYM3L');
    </script>
    <script type="module" src="./src/maps/pendulum/main.ts"></script>
</head>
<body>
    <div id="menu-backdrop" data-viewer-ui></div>
    <button type="button" id="menu-toggle" data-viewer-ui aria-label="Settings" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <div id="gpu-missing" hidden>
        This explorer needs WebGPU. The map is not computed on the CPU.
    </div>

    <div id="stage">
        <aside id="sidebar" data-viewer-ui>
            <div id="zoom-bar">
                <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
                <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
                <button type="button" id="zoom-reset" aria-label="Reset view">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            d="M9 9 4.6 4.6M9 9H5.4M9 9V5.4M15 9l4.4-4.4M15 9h3.6M15 9V5.4M9 15 4.6 19.4M9 15H5.4M9 15v3.6M15 15l4.4 4.4M15 15h3.6M15 15v3.6" />
                    </svg>
                </button>
            </div>
        </aside>
        <div id="map-clip">
            <div id="map-shift">
                <svg id="map-void" aria-hidden="true">
                    <defs>
                        <pattern id="dragons-pattern" width="300" height="220" patternUnits="userSpaceOnUse"
                            patternTransform="rotate(-24)">
                            <text x="150" y="88">HERE BE</text>
                            <text x="150" y="133">DRAGONS</text>
                        </pattern>
                    </defs>
                    <rect class="map-void-background" width="100%" height="100%"></rect>
                    <rect class="map-void-labels" width="100%" height="100%"></rect>
                </svg>
                <canvas id="map" class="map-view is-front" width="256" height="256" aria-label="Map"></canvas>
            </div>
            <canvas id="map-back" class="map-view map-pending" width="256" height="256" aria-hidden="true"></canvas>
            <canvas id="map-axes" aria-hidden="true"></canvas>
            <canvas id="probe-overlay" aria-hidden="true"></canvas>
            <div id="map-scale-x" aria-hidden="true"></div>
            <div id="map-scale-y" aria-hidden="true"></div>
        </div>
    </div>

    <div id="map-hud" data-viewer-ui>
        <div id="probe-count" role="slider" aria-label="Attachment points" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" tabindex="0">
            <div class="probe-count-track" id="probe-count-track">
                <div class="probe-count-fill" id="probe-count-fill"></div>
                <div class="probe-count-ticks" id="probe-count-ticks"></div>
                <div class="probe-count-thumb" id="probe-count-thumb"></div>
            </div>
        </div>
        <button type="button" id="probe-start" aria-label="Start simulation">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M8 5.2v13.6L19.2 12z" />
            </svg>
            <svg class="icon-reset" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    d="M4.6 12a7.4 7.4 0 1 0 2.1-5.2M4.6 4.8v4.2h4.2" />
            </svg>
        </button>
    </div>

    <div id="ui-container" data-viewer-ui>
        <div id="map-params"></div>
        <div id="map-extras">
            <div id="map-params-more"></div>
            <label class="slider-label">
                <span class="row"><span>Frame budget</span><span id="targetValue">1000 ms</span></span>
                <input type="range" id="targetSlider" min="200" max="4000" step="50" value="1000">
            </label>
            <button type="button" id="resetParams" class="text-button icon-button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        d="M4.6 12a7.4 7.4 0 1 0 2.1-5.2M4.6 4.8v4.2h4.2" />
                </svg>
                Reset parameters
            </button>
        </div>
        <div class="hint">
            A simulation starts three seconds after you stop. Click or double-tap to zoom in.
            Drag to pan, wheel or pinch to zoom. Right-click goes back.
            Use + / − to zoom.
        </div>
        <a class="learn-more" href="/fractal/">Learn more →</a>
    </div>
</body>
</html>

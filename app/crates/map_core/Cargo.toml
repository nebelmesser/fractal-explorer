[package]
name = "map_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]

ui.hint:
  text: >-
    Нажмите или дважды коснитесь, чтобы приблизить.

    Перетаскивайте карту, колесо или щипок меняют масштаб. Правый клик
    возвращает назад.

    Клавиши + / − тоже меняют масштаб.
ui.language:
  text: Язык
ui.learn_more:
  text: Узнать больше →
ui.map:
  text: Карта
ui.page.description:
  text: Каждый пиксель — опыт с двойным маятником. Приближайте живую фрактальную
    карту движения, неустойчивости и хаоса.
ui.page.title:
  text: Фрактал двойного маятника
ui.param.DT:
  text: Плавность (dt)
ui.param.F:

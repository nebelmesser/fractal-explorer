map-ready:
  text: Это карта из миллионов экспериментов с двойными маятниками. Попробуйте ее
    приблизить и рассмотреть подробнее
menu-open:
  text: Это меню настроек маятника
probe-detach:
  text: У маятника нет трения. Если он раскручивается слишком быстро, то срывается
    с оси
zoom-in-1:
  text: Траектория двойного маятника сильно зависит от начальных условий
zoom-in-2:
  text: Двойной маятник примечателен тем, что сильно зависит от начальных условий.
zoom-limit:
  text: Вы дошли до предела симуляции, но карта здесь не заканчивается

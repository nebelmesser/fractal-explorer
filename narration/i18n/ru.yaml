map-ready:
  text: Непостижимое мы обычно ищем в космосе. Но бесконечность есть и в обычных
    вещах. Приближайте карту для продолжения.
menu-open:
  text: На экране меняются только два угла. Добавим две массы и две длины — карта
    уже шестимерна. Перед нами лишь один плоский срез.
param-change:
  text: Меняя массу или длину, мы переходим в другой слой шестимерной карты. И в
    каждом слое — свои фрактальные границы.
params-reset:
  text: Вернёмся к исходному маятнику. Даже один срез неисчерпаем, а искать
    маятник нужно сразу в шести измерениях.
pendulum-hang:
  text: Оставшиеся маятники повторяют светлый рисунок карты. Ответ на карте есть.
    Тщетность прогноза — в попытке точно найти на ней настоящий маятник.
probe-detach:
  text: Маятники над тёмными точками срываются раньше. Над светлыми они держатся
    дольше.
simulation-other:
  text: Изменили массу или длину — и вся карта поменялась. Прежний прогноз больше
    не подходит.
simulation-others:
  text: Значит, надо без ошибки знать не только углы, но и само устройство. Любая
    неточность со временем уводит прогноз в сторону.
simulation-repeat:
  text: Тот же запуск — те же траектории. Хаос не случаен. Тщетность прогноза — в
    невозможности измерить старт бесконечно точно.
simulation-start:
  text: Запустим маятники из соседних точек. При одинаковом старте каждый раз
    получится одно и то же движение.

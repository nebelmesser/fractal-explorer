ui.param.L2:
  text: Длина 2
ui.param.M1:
  text: Масса 1
ui.param.M2:
  text: Масса 2
ui.reset_parameters:
  text: Сбросить параметры
ui.restart_simulation:
  text: Перезапустить симуляцию
ui.settings:
  text: Настройки
ui.start_simulation:
  text: Запустить симуляцию
ui.zoom.in:
  text: Приблизить
ui.zoom.out:
  text: Отдалить
ui.zoom.reset:
  text: Сбросить вид
zoom-8:
  text: Найти нужную точку полным перебором тоже не получится. Даже по тысяче
    точек в секунду этот уровень займёт 260 миллионов возрастов Вселенной.
zoom-absurd:
  text: Если напечатать всю карту со всей её детализацией в фотографическом
    качестве, она почти накроет орбиту Меркурия. И нужная точка всё ещё не
    найдена.
zoom-butterfly:
  text: Светлая и тёмная точки могут лежать почти вплотную. Но один маятник
    сорвётся быстро, а другой проживёт гораздо дольше. Малейшая разница в начале
    изменила исход. Это эффект бабочки.
zoom-error:
  text: Чтобы предсказать конкретный маятник, надо отыскать на карте именно его.
    Но измерения дают не точку, а пятно возможных положений. Внутри него —
    разное время жизни.
zoom-forecast:
  text: "Это двойной маятник: к одному маятнику подвесили второй на шарнире. Его
    движение описывают точные формулы. Значит ли это, что и будущее известно?"
zoom-horizon:
  text: Вот в чём тщетность точных прогнозов. Почти правильная точка сначала даёт
    похожее движение. Потом эффект бабочки превращает её в неверный прогноз.
zoom-laws:
  text: Приближаем это пятно в надежде найти нужную точку — а внутри снова светлые
    и тёмные участки. Новые детали появляются на каждом масштабе. Это и есть
    фрактал.
zoom-limit:
  text: На старых картах писали, что здесь водятся драконы. Узор не закончился —
    компьютер просто перестал различать соседние углы.
zoom-neighbors:
  text: Перед нами карта возможных запусков. Каждая точка — два начальных угла.
    Чем она светлее, тем дольше живёт маятник.
zoom-society:
  text: И это всего два угла одного маятника. В погоде, экономике или обществе
    переменных и ошибок измерения несравнимо больше.

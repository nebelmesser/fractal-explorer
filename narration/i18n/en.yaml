zoom-8:
  text: Finding the right point by brute force will not work either. Even at a
    thousand points per second, this level would take 260 million ages of the
    Universe.
zoom-absurd:
  text: If we printed the entire map with all its detail at photographic quality,
    it would almost cover Mercury's orbit. And the needed point still would not
    be found.
zoom-butterfly:
  text: A light point and a dark point can lie almost side by side. But one
    pendulum will fail quickly, while the other will last much longer. The
    slightest difference at the start changed the outcome. This is the butterfly
    effect.
zoom-error:
  text: To predict a particular pendulum, we need to find that exact one on the
    map. But measurements give us not a point, but a blur of possible positions.
    Inside it are different lifetimes.
zoom-forecast:
  text: "This is a double pendulum: a second pendulum is suspended from the first
    on a joint. Its motion is described by exact formulas. Does that mean its
    future is known too?"
zoom-horizon:
  text: This is the futility of precise forecasts. An almost correct point
    initially produces similar motion. Then the butterfly effect turns it into
    an incorrect prediction.
zoom-laws:
  text: We zoom in on this blur, hoping to find the right point—but inside there
    are light and dark areas again. New details appear at every scale. This is a
    fractal.
zoom-limit:
  text: You have reached the limit of the simulation, but the map does not end here
zoom-neighbors:
  text: Here is a map of possible launches. Each point represents two initial
    angles. The lighter it is, the longer the pendulum lasts.
zoom-society:
  text: And these are only two angles of a single pendulum. In weather, economics,
    or society, there are incomparably more variables and measurement errors.

map-ready:
  text: This is a map of millions of experiments with double pendulums. Try
    zooming in and examining it more closely
menu-open:
  text: This is the pendulum settings menu
param-change:
  text: By changing the mass or length, we move to another layer of a
    six-dimensional map. And each layer has its own fractal boundaries.
params-reset:
  text: Let us return to the original pendulum. Even a single slice is
    inexhaustible, while the pendulum must be sought in six dimensions at once.
pendulum-hang:
  text: The remaining pendulums reproduce the map's light pattern. The answer is
    on the map. The futility of prediction lies in trying to locate the real
    pendulum on it exactly.
probe-detach:
  text: The pendulum has no friction. If it spins too fast, it breaks off the axis
simulation-other:
  text: Change the mass or length, and the whole map changes. The previous
    prediction no longer applies.
simulation-others:
  text: So we need to know not only the angles but also the device itself without
    error. Any inaccuracy gradually pulls the prediction off course.
simulation-repeat:
  text: The same launch means the same trajectories. Chaos is not random. The
    futility of prediction lies in the impossibility of measuring the start with
    infinite precision.
simulation-start:
  text: Let us launch pendulums from neighboring points. With the same start, the
    motion will be the same every time.

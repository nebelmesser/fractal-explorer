# once: / on: — id реплики (i18n, mp3, «уже слышал»). Если id совпадает с
# именем из events.yaml, реплика ещё и подписывается на этот эвент приложения.
# Не повторяйте один id: сыграет только первая.
# when / unless — точное совпадение store или сравнение { lt, lte, gt, gte }.
# zoom_deg — градусы короткой оси вида. lte срабатывает при пересечении порога,
# в том числе если зум перескочил. once — один раз за сессию, on — каждый раз.
# Смена языка сбрасывает once.

cues:
  - once: map-ready
    text: >-
      Непостижимое мы обычно ищем в космосе. [pause]
      Но бесконечность есть и в обычных вещах. [pause]
      <emphasis>Приближайте карту для продолжения</emphasis>.

      


  # Первое увеличение: объясняем саму идею прогноза

  - once: zoom-forecast
    when:
      zoom_deg:
        lte: 45
    text: >-
      Это двойной маятник: [pause] к одному маятнику подвесили второй на шарнире.
      Его движение описывают точные формулы. <lower-pitch>Значит ли это, что и будущее известно?</lower-pitch>

  - once: zoom-neighbors
    when:
      zoom_deg:
        lte: 10
    text: >-
      Перед нами карта возможных запусков.
      Каждая точка — два начальных угла. Чем она светлее, тем дольше живёт маятник.


  # Эффект бабочки

## butterfly

  - once: zoom-butterfly
    when:
      zoom_deg:
        lte: 1
    text: >-
      Светлая и тёмная точки могут лежать почти вплотную.
      Но один маятник сорвётся быстро, а другой проживёт гораздо дольше.
      Малейшая разница в начале изменила исход. Это эффект бабочки.

  - once: zoom-error
    when:
      zoom_deg:
        lte: 0.1
    text: >-
      Чтобы предсказать конкретный маятник, надо отыскать на карте именно его.
      Но измерения дают не точку, а пятно возможных положений. Внутри него — разное время жизни.

  - once: zoom-laws
    when:
      zoom_deg:
        lte: 1.0e-2
    text: >-
      Приближаем это пятно в надежде найти нужную точку — а внутри снова светлые и тёмные участки.
      Новые детали появляются на каждом масштабе. Это и есть фрактал.


  # Возвращаем главную мысль

  - once: zoom-absurd
    when:
      zoom_deg:
        lte: 1.0e-3
    text: >-
      Если напечатать всю карту со всей её детализацией в фотографическом качестве,
      она почти накроет орбиту Меркурия.
      И нужная точка всё ещё не найдена.

  - once: zoom-society
    when:
      zoom_deg:
        lte: 1.0e-4
    text: >-
      И это всего два угла одного маятника.
      В погоде, экономике или обществе переменных и ошибок измерения несравнимо больше.

  - once: zoom-horizon
    when:
      zoom_deg:
        lte: 1.0e-5
    text: >-
      Вот в чём тщетность точных прогнозов.
      Почти правильная точка сначала даёт похожее движение. Потом эффект бабочки превращает её в неверный прогноз.

  # Пол у зума: короткая ось ≈ 1.07e-12° (MIN_VIEW_SPAN_F64).
  # Порог чуть выше пола, чтобы сработал и при скачке на стенку.

  - once: zoom-8
    when:
      zoom_deg:
        lte: 3.0e-08  
    text: >-
      Найти нужную точку полным перебором тоже не получится.
      Даже по тысяче точек в секунду этот уровень займёт 260 миллионов возрастов Вселенной.



  - once: zoom-limit
    when:
      zoom_deg:
        lte: 5.0e-12
    text: >-
      На старых картах писали, что здесь водятся драконы.
      Узор не закончился — компьютер просто перестал различать соседние углы.
      



## simulation

  - once: simulation-start
    text: >-
      Запустим маятники из соседних точек.
      При одинаковом старте каждый раз получится одно и то же движение.

  - once: simulation-repeat
    when:
      simulation_run: repeat
    text: >-
      Тот же запуск — те же траектории.
      Хаос не случаен. Тщетность прогноза — в невозможности измерить старт бесконечно точно.

  - once: simulation-other
    when:
      simulation_run: changed
      simulation_count:
        gte: 2
    text: >-
      Изменили массу или длину — и вся карта поменялась.
      Прежний прогноз больше не подходит.

  - once: simulation-others
    when:
      simulation_run: changed
      simulation_count:
        gte: 3
    text: >-
      Значит, надо без ошибки знать не только углы, но и само устройство.
      Любая неточность со временем уводит прогноз в сторону.


  - once: probe-detach
    text: >-
      Маятники над тёмными точками срываются раньше.
      Над светлыми они держатся дольше.

  - once: pendulum-hang
    text: >-
      Оставшиеся маятники повторяют светлый рисунок карты.
      Ответ на карте есть. Тщетность прогноза лежит в попытке точно найти на ней настоящий маятник.



  # Настройки / размерность задачи

  - once: menu-open
    text: >-
      На экране меняются только два угла.
      Добавим две массы и две длины — карта уже шестимерна. Перед нами лишь один плоский срез.
    at_start: settings-panel-highlight
    finally: settings-panel-unhighlight

  - once: param-change
    text: >-
      Меняя массу или длину, мы переходим в другой слой шестимерной карты.
      И в каждом слое — свои фрактальные границы.

  - once: params-reset
    text: >-
      Вернёмся к исходному маятнику.
      Даже один срез неисчерпаем, а искать маятник нужно сразу в шести измерениях.


  # Численная оговорка про detach

  # - once: probe-end
  #   text: >-
  #     Симуляция считает крупными шагами, поэтому движение немного дёрганое.
  #     Больше оборота за шаг мы считаем срывом.


